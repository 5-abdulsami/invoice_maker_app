name: invoicemaker
description: "Offline-first invoice and estimate maker for freelancers and small businesses."
publish_to: "none"

# version: <name>+<build>. Bump the build number for every Play Store upload.
version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management.
  provider: ^6.1.2

  # Formatting of dates and numbers.
  intl: ^0.20.2

  # PDF generation, rasterising for in-app previews, printing and sharing.
  pdf: ^3.11.0
  printing: ^5.13.2

  # Local storage location and user-chosen files for backup/restore.
  path_provider: ^2.1.3
  file_selector: ^1.0.3

  # Sharing generated PDFs and backup files with other apps.
  share_plus: ^10.0.2

  # Business logo capture and the drawn signature.
  image_picker: ^1.1.2
  signature: ^5.5.0

  # Privacy policy, store listing and feedback links.
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # The splash logo, and the typefaces used only inside the PDF templates,
  # read on demand by the templates that need them. Font licences are in
  # assets/fonts/licenses.
  assets:
    # Splash logo, pre-sized from the 1024px source art so the app does not
    # ship or decode a larger image than the splash draws.
    - assets/images/app_logo.png
    - assets/fonts/serif-regular.ttf
    - assets/fonts/serif-bold.ttf
    - assets/fonts/serif-italic.ttf
    - assets/fonts/abrilfatface-regular.ttf
    - assets/fonts/librefranklin-regular.ttf
    - assets/fonts/librefranklin-medium.ttf
    - assets/fonts/librefranklin-bold.ttf
    - assets/fonts/rubik-regular.ttf
    - assets/fonts/rubik-medium.ttf
    - assets/fonts/rubik-bold.ttf
    - assets/fonts/lato-regular.ttf
    - assets/fonts/lato-bold.ttf
    - assets/fonts/lato-italic.ttf
    - assets/fonts/robotomono-regular.ttf
    - assets/fonts/oswald-medium.ttf
    - assets/fonts/oswald-semibold.ttf

  fonts:
    # Bundled so the UI and the generated PDFs share one typeface, and so PDFs
    # can draw currency symbols the built-in Latin-1 PDF fonts cannot.
    - family: AppSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
    # Narrower companion, used for large amounts and PDF table headings.
    - family: AppSansNarrow
      fonts:
        - asset: assets/fonts/robotocondensed-light.ttf
          weight: 300
        - asset: assets/fonts/robotocondensed-regular.ttf
          weight: 400
        - asset: assets/fonts/robotocondensed-bold.ttf
          weight: 700
